<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <title>Smooth Scroll text animation demo</title>

        <link rel="stylesheet" href="/assets/css/settings.css">
        <link rel="stylesheet" href="/assets/css/page-scroll.css">
    </head>
<body>
    <main class="app">
        <div class="nav">
            <div class="nav_wrapper">
                <div class="nav_item">
                    <span>ES</span>
                </div>
                <div class="nav_item">
                    <span>Creative</span>
                </div>
                <div class="nav_item">
                    <span>Based in </span>
                    <span> Los Angeles</span>
                </div>
                <div class="nav_item">
                    <li>Index</li>
                    <li>Works</li>
                    <li>Gallery</li>
                    <li>Contact</li>
                </div>
            </div>

        </div>


        <section class="hero">
            <div class="hero_wrapper">
                <div class="hero_paragraph">
                    <p class="hero_paragraph_text">
                        Elnara is a Los Angeles based creative talent, who loves fusing
                        music, arts, and visuals to create authentic story telling
                        and to bring different lived experiences to light.
                    </p>
                </div>
            </div>
            <div class="hero_background">
                <img src="/assets/img/scroll.jpg" alt="" class="hero_background_image">
            </div>
        </section>
    </main>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/splitting@1.0.6/dist/splitting.min.js"></script>
    <script src="/assets/js/pagescroll.js"></script>
</body>
</html>
